syntax = "proto3";

package qrb.contract.telemetry.v1;

import "qrb/contract/common/v1/header.proto";

message TelemetryMessage {
  .qrb.contract.common.v1.Header header = 1;
  JointState joint_state = 2;
}

message JointState {
  repeated string name = 1;
  repeated double position = 2;
  repeated double velocity = 3;
  repeated double effort = 4;
}

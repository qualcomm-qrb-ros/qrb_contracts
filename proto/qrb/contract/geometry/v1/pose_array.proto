syntax = "proto3";

package qrb.contract.geometry.v1;

import "qrb/contract/geometry/v1/pose.proto";
import "qrb/contract/common/v1/header.proto";

// Mirrors geometry_msgs/PoseArray.
message PoseArray {
    qrb.contract.common.v1.Header header = 1;  // header.frame_id is the frame all poses are expressed in.
    repeated Pose                 poses  = 2;
}
